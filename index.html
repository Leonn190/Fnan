<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120e19">
  <meta name="description" content="Restaurante da Nathzinha — uma experiência de vigilância noturna inspirada nos clássicos de terror. Explore o escritório e as 12 câmeras do restaurante.">
  <title>Restaurante da Nathzinha | Noite 01</title>
  <link rel="icon" type="image/svg+xml" href="./public/images/branding/favicon.svg">
  <link rel="preload" as="image" type="image/webp" href="./public/images/office/states/open-dark.webp" fetchpriority="high">
  <link rel="stylesheet" href="./src/styles/main.css">
  <script defer src="./src/data/game-data.js"></script>
  <script defer src="./src/movement.js"></script>
  <script defer src="./src/map.js"></script>
  <script defer src="./src/sound.js"></script>
  <script defer src="./src/main.js"></script>
</head>
<body>
  <main class="game" id="game" data-mode="office">
    <section class="office-view" id="office-view" aria-label="Escritório de segurança do restaurante">
      <div class="office-scene" id="office-scene">
        <img class="office-art" id="office-art" src="./public/images/office/states/open-dark.webp" alt="Escritório de segurança, portão principal aberto e corredor escuro" draggable="false">
        <div class="office-characters" id="office-characters" aria-hidden="true"></div>
        <button class="monitor-hotspot" id="office-monitor" type="button" aria-label="Clicar no monitor da mesa para abrir as câmeras">
          <span class="hotspot-corner top-left"></span><span class="hotspot-corner top-right"></span>
          <span class="hotspot-corner bottom-left"></span><span class="hotspot-corner bottom-right"></span>
          <span class="hotspot-label">ABRIR MONITOR <span aria-hidden="true">↗</span></span>
        </button>
      </div>
      <div class="office-shading" aria-hidden="true"></div>
      <span class="office-reticle" aria-hidden="true"></span>
      <div class="office-location"><span class="location-dot"></span> ESCRITÓRIO DE SEGURANÇA <span class="location-sub">/ CONTROLE</span></div>
    </section>

    <section class="cameras-view" id="cameras-view" aria-label="Monitor de câmeras de segurança" hidden>
      <div class="camera-feed" id="camera-feed">
        <img class="feed-art" id="feed-art" alt="" draggable="false" decoding="async">
        <div class="technical-feed" id="technical-feed" hidden>
          <div class="technical-frame">
            <p class="technical-overline">MODO DE REFERÊNCIA</p>
            <img id="technical-art" alt="Planta técnica com campo de visão da câmera selecionada" decoding="async">
            <div class="technical-caption"><span id="technical-number">CAM 04</span> · CENÁRIO CINEMATOGRÁFICO AINDA NÃO INCLUÍDO</div>
          </div>
        </div>
        <div class="feed-color" aria-hidden="true"></div>
        <div class="feed-scanlines" aria-hidden="true"></div>
        <div class="feed-noise" aria-hidden="true"></div>
        <div class="feed-corners" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div class="camera-switch-flash" id="camera-switch-flash" aria-hidden="true"></div>
      </div>

      <div class="feed-heading">
        <div class="feed-heading-first"><span class="rec-light"></span> <span>REC</span><span class="feed-divider"></span><strong id="cam-number">CAM 01</strong></div>
        <div class="feed-room" id="cam-room">Lojinha</div>
      </div>
      <aside class="map-panel" id="map-canvas" aria-label="Mapa de câmeras e portões"></aside>
    </section>

    <div class="global-vignette" aria-hidden="true"></div>
    <div class="screen-grain" aria-hidden="true"></div>

    <header class="hud-top">
      <div class="night-clock"><div class="clock-time" id="clock-label">12 <small>AM</small></div><span>NOITE <strong>01</strong></span></div>
    </header>

    <button class="monitor-handle" id="monitor-handle" type="button" aria-label="Abrir as câmeras de segurança"><span class="handle-edge">⌃</span><span class="handle-icon">▣</span><span id="handle-label">ABRIR MONITOR</span><small id="handle-shortcut">ESPAÇO</small></button>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="initial-hint" id="initial-hint" aria-hidden="true">CLIQUE NO MONITOR DA MESA OU USE A BARRA INFERIOR</div>
    <div class="movement-debug" id="movement-debug" hidden></div>

    <div class="shift-complete" id="shift-complete" hidden role="dialog" aria-modal="true" aria-label="Turno encerrado">
      <div class="shift-light">✿</div><div class="shift-time">6:00 <small>AM</small></div><h2>O turno terminou.</h2><p>Primeira noite concluída.</p><button type="button" id="restart-shift">COMEÇAR NOVAMENTE</button>
    </div>
  </main>
</body>
</html>
