name: Publicar site estático no GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Explicar a configuração necessária do Pages
        if: failure() && steps.pages.outcome == 'failure'
        run: echo "::error::Confira Settings > Pages > Build and deployment > Source > GitHub Actions no repositório e execute o workflow novamente."
      - name: Preparar apenas os arquivos do jogo
        run: node scripts/package-pages.cjs
      - name: Enviar arquivos estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
